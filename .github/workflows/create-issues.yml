name: Daily Location Issue Creator

on:
  schedule:
    # Run once every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggers from GitHub Actions UI

permissions:
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Issue Creator Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-github-issues.mjs
